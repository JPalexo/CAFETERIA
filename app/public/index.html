<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Café Central · Iniciar sesión</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>☕</text></svg>" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/login.css" />
</head>
<body class="login cargando">
  <main>
    <section class="tarjeta-login">
      <header>
        <span class="logo" aria-hidden="true">☕</span>
        <h1>Café Central</h1>
        <p>Inicia sesión para continuar</p>
      </header>

      <form id="formLogin" novalidate>
        <p id="mensaje" class="mensaje oculto" role="alert"></p>

        <label class="campo">
          <span>Usuario</span>
          <input id="usuario" name="usuario" autocomplete="username" autocapitalize="none" spellcheck="false" required />
        </label>

        <label class="campo">
          <span>Contraseña</span>
          <div class="campo-password">
            <input id="password" name="password" type="password" autocomplete="current-password" required />
            <button type="button" id="btnVer" aria-pressed="false" aria-label="Mostrar contraseña">Mostrar</button>
          </div>
        </label>

        <button type="submit" class="btn btn-primario btn-entrar" id="btnEntrar">Entrar</button>
      </form>
    </section>
  </main>

  <script type="module" src="/js/login.js"></script>
</body>
</html>
